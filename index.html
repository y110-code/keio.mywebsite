<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      color: #242424;
      background: #f4f0e8;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    .profile {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: center;
      padding-bottom: 40px;
      border-bottom: 1px solid #d7d0c4;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      color: #ffffff;
      background: #2e6f73;
      font-size: 48px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1.15;
    }

    .lead {
      margin: 0;
      color: #5a5148;
      font-size: 18px;
    }

    section {
      padding: 32px 0 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    p {
      margin: 0;
    }

    ul {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 20px;
    }

    a {
      color: #1f5f63;
      font-weight: 700;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    @media (max-width: 640px) {
      main {
        padding: 32px 0;
      }

      .profile {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .avatar {
        width: 120px;
        height: 120px;
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <div class="avatar">名</div>
      <div>
        <h1>あなたの名前</h1>
        <p class="lead">こんにちは。ここに短い自己紹介の一文を書きます。</p>
      </div>
    </header>

    <section>
      <h2>自己紹介</h2>
      <p>
        はじめまして。Web制作やプログラミングに興味があります。
        新しいことを学びながら、自分らしい作品を作っていきたいです。
      </p>
    </section>

    <section>
      <h2>好きなこと</h2>
      <ul>
        <li>音楽を聴くこと</li>
        <li>カフェで作業すること</li>
        <li>新しい技術を試すこと</li>
      </ul>
    </section>

    <section>
      <h2>連絡先</h2>
      <p>
        Email:
        <a href="mailto:your.name@example.com">your.name@example.com</a>
      </p>
    </section>
  </main>
</body>
</html>
